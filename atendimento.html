<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Novatec</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #101820;
            color: white;
        }

        .caixa-login {
            max-width: 500px;
            margin: 100px auto;
            padding: 35px;
            background-color: #1c2733;
            border-radius: 15px;
        }

        .form-control {
            background-color: #e9ecef;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="caixa-atendimento">

            <h2 class="text-center mb-4">Novatec</h2>

            <h4 class="text-center mb-4">Mande sua mensagem</h4>

            <form>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control"
                        placeholder="Digite seu e-mail" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mensagem</label>
                    <input type="text" class="form-control"
                        placeholder="Digite sua dúvida ou questionamento" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Enviar mensagem
                </button>

            </form>

            <hr>


            <div class="text-center mt-3">
                <a href="site_ss.html" class="text-info">
                    Voltar para o início
                </a>
            </div>

        </div>

    </div>



</body>
</html>
